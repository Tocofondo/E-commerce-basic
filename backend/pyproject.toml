[project]
name = "ecommerce-backend"
version = "0.1.0"
description = "API en FastAPI para E-commerce Basic"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy==2.0.52",
    "psycopg[binary]==3.3.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.13.0",
    "bcrypt==5.0.0",
    "python-multipart==0.0.32",
    "alembic==1.19.2",
    "email-validator==2.3.0",
]

[tool.uv]
# No es un paquete instalable (no hay build-system): uv solo gestiona el
# venv y las dependencias, no intenta empaquetar app/.
package = false
